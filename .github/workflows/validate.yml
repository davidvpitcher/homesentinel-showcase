name: Validate synthetic C# sample
on:
  push:
    branches: [main, 'showcase/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hs-showcase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/ReviewSample.Tests/ReviewSample.Tests.csproj -c Release
      - run: dotnet run --project tests/ReviewSample.Tests -c Release --no-build
      - run: dotnet run --project src/ReviewSample -c Release --no-build -- blockers
